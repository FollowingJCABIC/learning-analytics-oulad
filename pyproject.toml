[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-analytics-oulad"
version = "0.1.0"
description = "SQL-first engagement, assessment, and outcome forecasting with OULAD"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jose Chavez" }]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=1.5,<3",
  "psycopg[binary]>=3.1,<4",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "seaborn>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<6",
  "ruff>=0.5,<1",
]

[project.scripts]
learning-analytics = "learning_analytics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
